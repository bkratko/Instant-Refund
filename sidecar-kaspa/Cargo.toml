[package]
name = "sidecar-kaspa"
version = "0.2.0"
edition = "2021"
description = "Instant Refund settlement signer: holds the only key, anchors refunds to Kaspa"

[dependencies]
anyhow = "1"
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
hmac = "0.12"
sha2 = "0.10"
secp256k1 = { version = "0.29", features = ["rand-std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
kaspa-wallet-core = "2.1.0"
kaspa-wrpc-client = "2.1.0"
kaspa-consensus-client = "2.1.0"
kaspa-addresses = "2.1.0"
[dev-dependencies]
kaspa-txscript = "2.1.0"

[profile.release]
strip = true
